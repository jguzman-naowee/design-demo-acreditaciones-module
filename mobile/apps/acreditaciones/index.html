<title>Demo · Módulo de acreditaciones</title>
<script>
// Base de la app: sirve igual en localhost, bajo /design-demo-acreditaciones-module/ de GitHub Pages y dentro del marco.
var m=location.pathname.match(/^(.*?)(\/(parametrization|delivery|validation|profile|audit)(\/.*)?)?$/);
window.__BASE__=(m[1]||'').replace(/\/index\.html$/,'').replace(/\/$/,'');
document.write('<base href="'+(window.__BASE__||'')+'/">');
</script>
<script>
// «?reset=1» (lo usan los casos): datos y evento elegido vuelven al principio. Los de Pages piden la ruta con «?r=».
try{var q=new URLSearchParams(location.search);
if(q.has('reset')){localStorage.removeItem('naowee.acreditaciones-module.estado');localStorage.removeItem('naowee.acreditaciones.active-event');localStorage.removeItem('naowee.acreditaciones.validacion');localStorage.removeItem('naowee.acreditaciones.usuarios');localStorage.removeItem('naowee.acreditaciones.usuarios.v2');localStorage.removeItem('naowee.acreditaciones.usuarios.v3');localStorage.removeItem('naowee.acreditaciones.usuarios.v4');localStorage.removeItem('naowee.acreditaciones.formularios');localStorage.removeItem('naowee.acreditaciones.categorias');localStorage.removeItem('naowee.acreditaciones.tipos-nombres');}
if(q.get('r')){history.replaceState(null,'',window.__BASE__+q.get('r'));}}catch(e){}
</script>
<script>
// Renombre del evento de la demo: lo que ya quedó guardado en el navegador con el nombre anterior se actualiza.
try{['naowee.acreditaciones.active-event','naowee.acreditaciones-module.estado'].forEach(function(k){var v=localStorage.getItem(k);if(v&&(v.indexOf('Mini migraci')>-1||v.indexOf('Fase Eliminatoria')>-1)){localStorage.setItem(k,v.split('Juegos Intercolegiados 2026 - Mini migración STG').join('Juegos Intercolegiados').split('Fase Eliminatoria').join('Fase Regional'));}});}catch(e){}
</script>
